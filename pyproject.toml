[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-voice-agent"
version = "1.0.0"
description = "Local-first RideCo ride-booking voice agent for LiveKit"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "livekit-agents>=1.6.9,<2",
  "livekit-plugins-ai-coustics~=0.2",
  "livekit-plugins-deepgram>=1.6.10,<2",
  "livekit-plugins-google>=1.6.10,<2",
  "livekit-plugins-silero>=1.6.10,<2",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["ride_voice_agent"]
package-dir = {ride_voice_agent = "agent"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires the local Docker Compose services"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
